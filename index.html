S:['지방교육행정기관 재정투자사업 심사규칙','https://www.law.go.kr/법령/지방교육행정기관재정투자사업심사규칙','투자심사 대상 및 기준'],

// Each record: group, title, key point, explanation, analytical exercise, question, answer, sources.
const rows=[
['01 재정의 구조','재정·예산·결산','예산은 계획, 결산은 결과, 재정은 전체 관리 체계다.','재정은 재원 조달·배분·집행·성과·채무까지 포괄한다. 예산의 증감은 정책 선택을 보여주지만 서비스 성과를 곧바로 증명하지 않는다.','신규 교육사업 50억 원을 검토할 때 필요성뿐 아니라 대체 사업의 기회비용과 향후 운영비를 함께 확인한다.','예산이 늘면 정책성과도 반드시 개선되는가?','아니다. 집행·산출·결과 지표가 필요하다.','HQ'],
['01 재정의 구조','국가와 지방의 재정관계','재원 이전은 재정 격차와 사무 배분을 연결한다.','국가와 지방은 담당 사무와 세입 기반이 다르다. 지방교부세와 지방교육재정교부금은 서로 다른 제도이며 국고보조금은 일반재원과 달리 사업 조건을 수반할 수 있다.','중앙정부 이전수입을 일괄적으로 자율 사용 가능 재원으로 계산하지 않는다.','지방교부세와 교육재정교부금은 동일한가?','아니다. 법적 근거와 배분 대상이 다르다.','HJ'],
['01 재정의 구조','일반회계·특별회계·기금','회계 구분은 돈의 목적과 통제 방식의 차이다.','교육비특별회계는 교육·학예 경비를 관리하는 중심 회계다. 기금은 특정 목적의 자금을 별도 운용하며 기금운용계획과 결산에 대한 의회 통제를 받는다.','기금 전입으로 예산이 늘어도 외부 신규 재원이 증가한 것은 아닐 수 있다.','기금은 의회 심의 대상이 아닌가?','기금운용계획 및 결산도 심의 대상이다.','HKO'],
['01 재정의 구조','총계와 순계','통합 범위 안의 내부 거래는 중복 제거한다.','서울시 1,000억 원, 교육청 500억 원 중 서울시 전출금이 200억 원이라면 가상 통합 총계는 1,500억, 순계는 1,300억이다. 분석 범위가 다르면 차감할 내부 거래도 달라진다.','교육비특별회계와 기금의 합산액에서 기금 전입·전출을 대조한다.','총계가 순계보다 크다고 재정이 확대된 것인가?','내부 거래 중복 가능성이 있어 단정할 수 없다.','HQR'],
['01 재정의 구조','재정자립도와 재정자주도','스스로 조달한 재원과 자율 사용 가능한 재원은 다르다.','일반 지방재정에서 재정자립도는 자체재원의 비중, 재정자주도는 자주재원 비중을 나타낸다. 지표의 분모와 산식은 공시 기준을 확인한다. 교육청에는 동일 산식을 기계적으로 적용하지 않는다.','시도교육청 비교 시 이전재원 의존도·인건비 비중·가용재원을 별도로 분석한다.','교육청의 이전수입 비중이 높으면 곧바로 비효율인가?','아니다. 법정 재원조달 구조를 고려해야 한다.','AR'],
['02 교육재정','교육비특별회계와 학교회계','교육청 회계와 학교 단위 회계를 구분한다.','교육비특별회계는 시도의 교육·학예에 관한 경비를 관리한다. 학교회계는 학교 단위 재정 운영을 위한 별도 회계다. 학교전출금은 교육청 지출이면서 학교의 수입이므로 전출 실적과 학교의 실제 사업 집행은 다를 수 있다.','학교전출금 집행률 100%라도 학교별 집행잔액과 사업 결과를 추가 요구한다.','교육청 전출 완료는 학교 사업 완료와 같은가?','아니다. 학교의 실제 집행과 성과를 확인해야 한다.','KFM'],
['02 교육재정','지방교육재정교부금의 재원','국가 세수와 교육청 재정은 연결되어 있다.','교부금은 법정 내국세 연동분과 교육세 관련 재원으로 조성된다. 세율·제외 세목·특례는 해당 회계연도 법 제3조 및 부칙에서 확인한다. 내국세 추계와 실제 수납액 차이는 정산을 통해 이후 재정에 영향을 준다.','본예산 교부금 추계와 최종 교부 통지액, 정산 예정액을 비교한다.','세수 감소는 교육청 재정과 무관한가?','교부금 조성 및 정산을 통해 영향을 줄 수 있다.','J'],
['02 교육재정','보통교부금 산정 원리','기준재정수요액과 기준재정수입액의 차이가 핵심이다.','두 금액은 교부금 산정용 법정 개념으로 실제 예산액과 다르다. 수요 측정항목·단위비용과 수입 산정 항목, 조정 및 정산을 구분한다. 가상 수요 12조, 수입 4조라면 단순 부족액은 8조다.','전입금 증가가 교부금 산정에 미치는 영향을 확인하되 실제 교부액을 단순 차액으로 단정하지 않는다.','기준재정수요액은 실제 세출예산액인가?','아니다. 산정 규칙에 따른 재정수요다.','J'],
['02 교육재정','특별교부금과 목적재원','목적과 교부조건이 집행의 경계를 정한다.','특별한 재정수요에 대응하는 교부금은 교부 목적과 사업기간을 확인해야 한다. 종료 후 자체재원으로 사업을 지속할 경우 장래 재정부담을 따로 평가한다.','교부 통지서, 사업계획, 집행잔액, 반납 및 변경 승인 자료를 대조한다.','특별교부금 잔액을 임의로 다른 사업에 쓸 수 있는가?','교부조건과 변경 절차를 확인해야 하며 임의 사용은 곤란하다.','JF'],
['02 교육재정','서울시 법정·비법정 전입금','법적 부담액과 협의에 따른 지원을 구분한다.','법정전입금에는 지방교육세 등 법률이 정한 재원이 포함된다. 서울시의 구체적인 부담 기준은 교부금법 제11조와 관련 특례를 확인한다. 비법정 지원은 협의와 예산 확보 여부가 중요하다.','서울시 예산의 전출금과 교육청 세입의 전입금을 대조하고 미전입·정산 차이를 확인한다.','법정전입금과 비법정전입금의 확보 확실성은 같은가?','법적 의무와 협의 재원이라는 차이가 있다.','JM'],
['02 교육재정','재정경직성과 가용재원','인건비 외에도 줄이기 어려운 경비가 있다.','법정 의무지출과 분석상 경직성 경비는 동일하지 않다. 인건비·필수 운영비·계약상 지급 의무를 고려해 실질 가용재원을 추정한다.','총예산 100, 경직성 경비 75, 목적재원 사업 10이면 단순 가용분은 15다. 실제 분석에서는 중복을 제거한다.','인건비를 제외한 금액은 모두 재량재원인가?','아니다. 계약·법정 지출과 목적재원도 고려한다.','HFM'],
['03 예산 편성','사업예산 분류체계','사업 분류와 지출 성질 분류는 다른 축이다.','정책사업→단위사업→세부사업은 정책 목표와 수행 단위를 나타낸다. 목·원가통계목 등은 지출 성격을 나타낸다. 교육부 제577호는 세입 및 세출 사업별·성질별 분류를 정비했다.','동일 사업의 과목 변경을 실제 사업 확대·감축과 구분하고 연도 간 코드 연결표를 만든다.','과목명이 바뀌면 신규사업인가?','아니다. 사업 내용과 분류 개편을 대조한다.','AFG'],
['03 예산 편성','예산서 읽는 순서','총괄표에서 이상치를 찾고 사업설명서에서 원인을 확인한다.','예산총칙→세입총괄→세출총괄→세출사업명세→사업별 설명자료→성과계획서 순서로 읽는다. 최근 결산서와 당해연도 집행 자료를 나란히 놓는다.','부서 전체 10% 증액이라면 인건비·시설비·신규사업 등 증감 기여 항목을 분리한다.','사업설명서만으로 편성금액의 타당성을 확정할 수 있는가?','결산·산출근거·집행계획 등 교차 확인이 필요하다.','FM'],
['03 예산 편성','산출근거 검증','단가 × 수량 × 기간을 각각 검증한다.','총액이 같아도 단가 상승과 대상 확대는 다른 설명을 요구한다. 전년도 100개×100만원, 차년도 120개×110만원이면 총 1억3200만원으로 32% 증가한다.','시장가격·계약 실적·수요조사·지원 제외 대상과 중복 산정을 확인한다.','단가 10%, 수량 20% 증가면 총액 증가율은 30%인가?','32%다. 교차효과 2%가 있다.','AHF'],
['03 예산 편성','본예산과 추경','추경은 성립된 예산의 변경이며 단순 추가 지출이 아니다.','세입 여건 변화, 긴급한 사업 필요, 사업계획 변경 등에 대응한다. 감액 추경도 가능하다. 심사에서는 본예산 당시 예측 가능성과 남은 집행기간이 중요하다.','11월 신규 시설사업이면 계약과 공사기간, 이월 가능성을 검토한다.','추경은 항상 예산을 증가시키는가?','아니다. 감액도 가능하다.','H'],
['03 예산 편성','성립전 사용','긴급성만으로는 성립전 사용이 허용되지 않는다.','지방재정법 제45조의 법정 예외를 확인한다. 용도가 지정되고 소요 전액이 교부된 경비 등 법정 요건과 별도 재해복구 요건이 존재하며 차기 추경에 계상한다.','교부 공문과 실제 집행일, 차기 추경 반영 여부를 검증한다.','교육청 자체재원 사업이 급하면 성립전 사용 가능한가?','긴급성만으로는 법정 예외에 해당하지 않는다.','HD'],
['03 예산 편성','예비비','예측할 수 없는 지출을 대비하되 의회 통제를 피하는 수단은 아니다.','법정 예비비 편성·사용 제한을 확인하고 사용 결과에 대한 의회 승인을 검토한다. 이미 예측 가능한 반복 사업은 정상 편성 필요성이 크다.','본예산 심사에서 감액된 사업을 예비비로 추진했는지 확인한다.','예비비는 아무 사업에나 사용할 수 있는가?','법정 목적과 사용 제한을 따른다.','H'],
['04 행안부 지침','행안부 편성기준의 구조','기준경비와 예산과목은 편성 통제의 핵심이다.','행안부 제449호 제1조는 사업예산 성과관리, 기준경비, 세입·세출 과목 체계를 규율한다. 개정 이유에는 특정업무경비 정비, 시설비 통계목 세분화 및 국고보조금 정산금 편성 관련 변경이 포함된다.','일반회계의 경비 한도나 통계목을 교육청에 그대로 적용하지 말고 교육부 지침과 해당 연도 적용 범위를 대조한다.','행안부 편성기준의 모든 금액 한도가 교육청에도 동일한가?','아니다. 교육비특별회계의 직접 적용 기준을 확인한다.','ABFG'],
['04 행안부 지침','기준경비와 행사성 경비','정해진 기준과 사업의 실질을 함께 확인한다.','업무추진비·여비·행사성 경비 등은 적용 지침의 편성 및 집행 요건을 분리해서 읽는다. 과목 선택은 사업 명칭이 아니라 지급 대상과 지출 실질에 따라 판단한다.','행사비에 식비와 기념품이 섞여 있다면 지급 목적, 대상, 단가, 과목, 증빙을 분해한다.','편성 한도 이내이면 모든 집행이 적정한가?','아니다. 집행 목적과 증빙, 제한도 충족해야 한다.','ACP'],
['04 행안부 지침','회계관리 훈령의 읽는 법','예산 확보와 적법한 지출은 별개의 통제다.','행안부 회계관리 훈령은 지방회계법령 위임사항과 관서별 회계관리 체계를 구체화한다. 교육청 집행은 교육부 세출예산 집행기준과 교육청 회계 규정도 확인한다.','계약·검수·지출결의·지급 증빙이 서로 일치하는지 확인하고 사후 작성 여부도 검토한다.','예산이 편성되면 증빙이 없어도 지출할 수 있는가?','아니다. 회계 및 계약 절차를 준수해야 한다.','CIP'],
['04 행안부 지침','질의회신 사례집 활용법','과거 회신을 현행 법령과 대조하는 것이 핵심이다.','행안부 2011년 사례집은 반복 질의와 불명확한 규정의 해석을 모은 자료다. 개별 원문은 아직 확인하지 못했으므로 아래 연습 문답을 실제 회신으로 인용하지 않는다. 원문 확보 후 질의·회신·당시 조문·현행 조문을 연결해야 한다.','연습 쟁점: 의회 감액 사업을 전용으로 되살릴 수 있는가? 현재 지방재정법 제49조의 의결 취지 제한부터 검토한다.','2011년 회신이 현재에도 자동 적용되는가?','아니다. 개정 법령과 사실관계 대조가 필요하다.','DH'],
['05 사전 절차','중기지방교육재정계획','단년도 예산을 다년도 재원 전망과 연결한다.','중기계획은 향후 재정수입과 투자·사업 수요를 전망한다. 연도별 예산과 계획의 차이가 발생하면 정책 변화, 재원 변경 및 사업 일정의 사유를 확인한다.','신규 시설사업의 총사업비와 향후 5년 운영비, 다른 투자사업과의 우선순위를 비교한다.','중기계획에 포함되면 예산 의결이 생략되는가?','아니다. 개별 연도 예산 심의가 별도로 필요하다.','H'],
['05 사전 절차','재정투자심사','예산 편성 전에 사업의 필요성과 타당성을 검증한다.','교육청 투자심사는 지방교육행정기관 재정투자사업 심사규칙을 기준으로 사업 유형·금액·재원·심사 주체를 확인한다. 총사업비 변경 등 재심사 요건과 조건부 심사 결과도 중요하다.','부지비·설계비·공사비·부대비를 포함한 총사업비 산정과 심사 결과를 대조한다.','당해연도 설계비만으로 투자심사 대상 여부를 판단하는가?','총사업비 등 법정 기준을 확인한다.','HS'],
['05 사전 절차','공유재산과 계약','예산 의결이 모든 사전절차를 대체하지 않는다.','공유재산 취득·처분, 투자심사, 계약 및 보조금 심의 등은 각 제도의 적용 요건을 독립적으로 판단한다.','학교 신설 사업의 부지 취득, 관리계획, 투자심사, 설계·공사 계약 일정을 연결한다.','예산이 의결되면 공유재산 관리계획 의결이 필요 없는가?','해당 법령의 적용 대상이면 별도 절차가 필요하다.','HS'],
['06 집행','이용·전용·이체','정책사업 간 이동, 정책사업 내 변경, 조직 변경을 구별한다.','이용은 정책사업 간 이동으로 사전 의회 의결이 필요하다. 전용은 정책사업 내 법정 범위에서 가능하나 미편성 사업 및 의결 취지와 다른 집행이 제한된다. 이체는 조직 또는 직무권한 변경에 따른다. 세부 제출기한과 제한은 제47조의2·제49조를 확인한다.','변경 전후 사업코드·금액·결재·의회 보고 내역을 대조한다.','삭감 사업을 전용으로 되살려도 되는가?','의회 의결 취지에 반하는 전용은 허용되지 않는다.','HD'],
['06 집행','배정과 계약의 차이','배정은 집행 권한, 계약은 지급의무 발생과 연결된다.','예산 확정 후 배정·집행품의·계약 또는 지출원인행위·검수·지출의 흐름을 구분한다. 계약금액과 실제 지출은 기성·준공 일정에 따라 다를 수 있다.','집행부진 자료에서 계약액만 제시되면 실제 지출액과 잔여 지급예정액을 별도로 요구한다.','계약률 100%는 집행률 100%인가?','아니다. 지출액 기준 집행률과 다르다.','CIP'],
['06 집행','학교전출금과 보조사업','돈을 이전한 이후의 집행과 성과도 추적한다.','학교회계 전출과 민간 보조금은 법적 성격과 정산 방식이 다르다. 사업별 재원과 적용 규정을 확인하고 목적 외 사용 및 잔액 처리를 검토한다.','교육청 지출액과 학교별 실제 집행·잔액·사업 실적의 차이를 확인한다.','전출금이 모두 지급되면 성과 검증이 끝나는가?','아니다. 최종 사용 및 사업 결과를 확인한다.','FPI'],
['07 결산','예산현액과 결산 수치','집행률의 분모는 원칙적으로 예산현액이다.','최종예산에 이월 및 예산 변경 등을 반영한 예산현액과 실제 지출액을 비교한다. 예산현액 100억, 지출 65억, 이월 25억, 반납 별도 없음이면 잔액 10억이다.','본예산 80억만을 분모로 쓰면 81.25%로 왜곡된다. 정확한 집행률은 65%다.','집행률 65%에서 나머지 35%가 전부 불용인가?','아니다. 이월액과 반납금 등의 분류를 확인한다.','HI'],
['07 결산','명시·사고·계속비이월','이월의 사유와 법적 근거를 구별한다.','명시이월은 연내 지출 곤란을 예상하여 의회 의결을 받는 방식이다. 사고이월은 지출원인행위 및 불가피한 사유 등 법정 요건을 적용하며 예외 유형도 있다. 계속비이월은 계속비 사업의 연도별 미지출액을 사업완성 연도까지 이월하는 제도다.','이월 승인·계약일·공정표·지연 사유와 재이월 여부를 확인한다.','사고이월에는 모든 경우 지출원인행위가 필수인가?','법정 예외가 있어 제50조를 확인해야 한다.','H'],
['07 결산','불용과 집행잔액','불용의 규모보다 원인과 반복성이 중요하다.','낙찰차액, 수요 감소, 사업 취소, 계획 부실, 집행시기 지연 등 원인을 분리한다. 결산서의 보조금 반납금과 집행잔액 구분을 확인한다.','3년 연속 집행부진인데 동일 규모를 편성했다면 실제 수요와 개선계획을 요구한다.','불용액이 발생하면 무조건 부적정인가?','아니다. 합리적 절감인지 계획 실패인지 구분한다.','HI'],
['07 결산','세계잉여금과 순세계잉여금','세입·세출 차액 전부를 자유롭게 쓸 수는 없다.','결산상 잉여금에서 다음연도 이월액 및 반납해야 할 보조금 등 해당 결산기준의 차감항목을 제외하여 순세계잉여금을 산정한다. 세입 초과수납과 세출 미집행 원인을 분리한다.','가상 잉여금 100, 이월 60, 반납 10이면 단순 순세계잉여금은 30이다.','결산상 잉여금 100억이면 모두 신규사업에 사용 가능한가?','아니다. 이월·반납 등 차감항목을 확인한다.','HI'],
['07 결산','재무제표와 예산결산','현금 중심 집행과 발생주의 재무정보를 함께 본다.','재정상태표는 자산·부채 등을, 재정운영표는 수익·비용을 보여준다. 예산결산의 지출액과 재무제표 비용은 자산취득·감가상각 등으로 차이가 날 수 있다.','학교 건물 신축 지출을 당해연도 비용과 동일시하지 않는다. 자산 변동과 유지비를 확인한다.','시설 취득 지출 전액이 같은 해 재무회계 비용인가?','일반적으로 자산 인식과 감가상각 등을 구분한다.','IE'],
['08 기금·성과','기금운용계획과 내부거래','기금 잔액과 실제 사용 가능액은 다르다.','기금 조성 목적, 예치금, 수입·지출계획, 의무 지출 및 향후 계획을 확인한다. 운용계획 변경은 법정 의결 요건과 예외를 따로 검토한다.','기금 인출로 반복사업을 유지하는 경우 향후 잔액 감소와 재원 대체 방안을 분석한다.','기금 잔액을 모두 일반재원처럼 사용 가능한가?','아니다. 목적 및 법정 운용 조건에 따른다.','OBF'],
['08 기금·성과','성과계획과 성과보고','집행률은 성과가 아니라 집행 지표다.','투입(예산), 활동(프로그램), 산출(참여자), 결과(교육적 변화)를 구분한다. 성과지표가 단순 참여자 수라면 실제 교육 효과와는 차이가 있을 수 있다.','목표 1,000명 중 1,100명 참여로 110% 달성했더라도 만족도와 학습 효과를 별도 검토한다.','성과 달성률 100%면 사업 효과가 입증되는가?','지표의 타당성과 결과를 추가 확인해야 한다.','AHQ'],
['09 의회 심사','교육위원회와 예결특위','예비심사와 종합심사는 상호 보완한다.','교육위원회는 소관 정책과 사업을 예비심사하고 예결특위는 예산·결산을 종합 심사한다. 본회의에서 최종 의결한다. 서울시의회 회의규칙상 조정 및 절차를 확인한다.','교육위원회 의견과 예결특위 조정 결과의 차이를 추적하고 근거를 정리한다.','예결특위 심사 결과만으로 예산이 확정되는가?','본회의 의결 절차를 거친다.','LNT'],
['09 의회 심사','의회의 증액·감액 권한','감액과 증액은 같은 방식으로 처리되지 않는다.','지방자치법 제142조에 따라 의회는 집행기관장 동의 없이 지출예산 각 항의 금액을 늘리거나 새로운 비용항목을 설치할 수 없다. 교육청 안건은 교육감 권한과 관련 규정을 대조한다.','수정안에서 감액 재원을 신규 비용항목으로 배분하는 경우 동의 절차를 확인한다.','감액 재원이 있으므로 의회가 동의 없이 신규 항목을 만들 수 있는가?','아니다. 법정 동의 요건을 충족해야 한다.','LKND'],
['09 의회 심사','예산안과 결산의 법정 일정','제출·심사·의결 기한을 구분한다.','시·도 예산안은 회계연도 시작 50일 전까지 제출하고 의회는 15일 전까지 의결하는 것이 지방자치법상 기본 규정이다. 결산은 출납폐쇄 후 80일 이내 결산서 작성 등 별도 절차를 따른다.','실제 회기 일정과 제출 자료, 검토보고서 작성 시점을 연결하여 업무계획을 세운다.','예산안 제출 기한과 의결 기한은 동일한가?','아니다. 각각 50일 전과 15일 전이다.','LIKN'],
['09 의회 심사','결산 승인과 시정 요구','결산은 과거 집행을 검증하고 다음 예산에 연결한다.','결산 심사에서 위법·부당한 사항을 발견하면 법정 절차에 따라 시정을 요구할 수 있다. 결산 승인이 위법 집행을 적법하게 바꾸는 것은 아니다.','전년도 지적사항의 조치 여부와 차년도 예산 반영 여부를 연결한다.','결산 승인으로 위법한 집행이 자동 치유되는가?','아니다. 책임과 시정 문제는 별도로 검토한다.','LIT'],
['10 심사 분석','예산 증감의 분해','총액 증감보다 증감의 구성요인을 분석한다.','사업 신설·폐지, 단가, 수량, 기간, 재원 변경, 사업 이관, 과목 변경을 구분한다. 비교 기준은 본예산 대 본예산 또는 최종예산 대 최종예산 등 목적에 맞춘다.','전년 100억→150억이면 50% 증가. 이 중 30억이 타 부서 이관이면 실질 확대분을 별도로 분석한다.','부서 예산 증가액은 전부 신규 투자액인가?','아니다. 이관·분류 변경 등을 제거해야 한다.','MQ'],
['10 심사 분석','집행부진 사업의 증액 요구','실적·원인·증액 필요성을 순서대로 확인한다.','가상 사업: 예산현액 100억, 지출 60억, 이월 25억, 잔액 15억, 신규 요구 150억. 집행률 60%, 이월률 25%, 잔액률 15%다. 이월사업과 신규 수요의 중복을 검토한다.','요구자료: 최근 3년 결산, 학교별 수요, 이월 집행계획, 신규 요구 산출근거.','집행률 60%라는 사실만으로 50억 감액을 결정할 수 있는가?','아니다. 이월과 집행부진 원인, 신규 수요를 확인한다.','HMQ'],
['10 심사 분석','시설사업과 총사업비','당해연도 편성액보다 총사업비와 공정이 중요하다.','시설사업은 설계·부지·공사·감리·부대비와 물가 상승, 공정 지연에 따른 총사업비 변경을 분석한다. 이월액과 신규 요구액이 동일 공정을 중복 반영하지 않는지 확인한다.','총사업비 500억, 기투자 200억, 당해 요구 100억이면 잔여 200억의 조달 계획도 검토한다.','연도별 요구액만 검토하면 충분한가?','총사업비와 다년도 소요 재원을 함께 봐야 한다.','HSM'],
['10 심사 분석','유사·중복 사업','이름보다 대상·목적·지원 내용의 중복을 본다.','동일한 교육 목표라도 대상이나 전달 방식이 달라 중복이 아닐 수 있다. 반대로 명칭이 달라도 동일 학생·학교에 동일 지원을 제공하면 중복 가능성이 있다.','부서별 사업 목록을 대상, 지원단가, 지원항목, 재원, 기간으로 비교한다.','명칭이 다르면 중복사업이 아닌가?','사업의 실질을 비교해야 한다.','MQ'],
['10 심사 분석','검토보고서와 질의자료','사실→기준→차이→확인사항→검토의견 순서로 쓴다.','검토보고서는 확인되지 않은 사실을 단정하지 않는다. 수치의 출처와 비교 기준을 명시하고, 법적 판단과 정책적 판단을 분리한다. 질의자료는 답변 가능한 구체적인 질문과 요구자료를 연결한다.','예시: 전년도 이월 25억의 집행 예정일과 차년도 신규 요구액의 중복 여부를 사업별로 제출해 주시기 바랍니다.','의혹이 있다는 표현만으로 충분한 검토의견인가?','객관적 근거와 검증할 쟁점을 명확히 제시해야 한다.','MQT']
];

const KEY='edu-finance-notes-v1';let state={done:[],marks:[],last:0,y:0,size:17,dark:false,notes:{}};try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}let current=-1, mode=-1; const menuNames=["교육재정·예결산 전문지식","서울시의회·교육청 조직 및 직무"]; function inMenu(i){return mode<0||(mode===0?i<financeCount:i>=financeCount)} function choose(m){mode=m;go(-1)}const $=x=>document.getElementById(x);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('progressText').textContent='브라우저 저장 기능을 사용할 수 없습니다.'}}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function refs(keys){return [...keys].map(k=>{let s=sources[k];return `<p class="src"><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])} ↗</a><br>${esc(s[2])}</p>`}).join('')}function nav(){let q=$('search').value.trim().toLowerCase(),g='';$('nav').innerHTML=rows.map((r,i)=>{if(!inMenu(i)&&!q)return '';if(q&&!r.join(' ').toLowerCase().includes(q))return '';let heading=g!==r[0]?`<h4>${r[0]}</h4>`:'';g=r[0];return heading+`<button class="${current===i?'active':''}" onclick="go(${i})">${state.done.includes(i)?'✓ ':''}${state.marks.includes(i)?'★ ':''}${String(i+1).padStart(2,'0')}. ${esc(r[1])}</button>`}).join('')||'<p class="meta">검색 결과 없음</p>';let total=rows.filter((r,i)=>inMenu(i)).length, finished=state.done.filter(inMenu).length;$('progress').value=finished/total*100;$('progressText').textContent=`학습 완료 ${finished} / ${total} 단원`}
function home(){if(mode<0){$('main').innerHTML=`<div class="meta">개인 전문 학습서</div><h1>교육재정·예결산 실무</h1><p>학습할 영역을 선택하세요.</p><div class="homegrid">${[1,0].map(m=>{let ids=rows.map((r,i)=>((m===0&&i<financeCount)||(m===1&&i>=financeCount))?i:-1).filter(i=>i>=0);return `<button class="tile" onclick="choose(${m})"><span class="meta">MENU ${m===1?'01':'02'}</span><h2>${menuNames[m]}</h2><small>${m===1?'교육자치 · 의회 조직 · 예결특위 직무':'재정 이론 · 편성·집행·결산 · 행안부 지침 · 심사 사례'}</small><p>${ids.filter(i=>state.done.includes(i)).length} / ${ids.length} 완료</p></button>`}).join('')}</div><div class="panel"><button class="primary" onclick="resume()">이어서 공부하기 →</button><p class="meta">${esc(rows[state.last]?.[1]||'첫 단원')}</p></div><button onclick="backup()">진도 내보내기</button> <button onclick="document.getElementById('import').click()">진도 가져오기</button><input id="import" type="file" accept="application/json,.json" hidden onchange="restore(this)">`;return}let groups=[...new Set(rows.filter((r,i)=>inMenu(i)).map(r=>r[0]))];$('main').innerHTML=`<div class="meta">개인 학습용 · 2026.11.24 · 초판</div><button onclick="choose(-1)">← 전체 메뉴</button><h1>${menuNames[mode]}</h1><p>서울시의회 예산결산특별위원회 심사 지원을 위한 개념, 기준, 분석 및 사례 연습.</p><div class="panel"><b>전체 학습 진도 ${Math.round(state.done.length/rows.length*100)}%</b><progress max="${rows.length}" value="${state.done.length}"></progress><p>${state.done.length} / ${rows.length} 단원 완료</p><button class="primary" onclick="resume()">이어서 공부하기 →</button><p class="meta">마지막 단원: ${esc(rows[state.last]?.[1]||rows[0][1])}</p></div><h2>학습 목차</h2><div class="homegrid">${groups.map(g=>{let ids=rows.map((r,i)=>r[0]===g?i:-1).filter(i=>i>=0);return `<button class="tile" onclick="go(${ids[0]})"><b>${g}</b><small>${ids.filter(i=>state.done.includes(i)).length} / ${ids.length} 완료</small></button>`}).join('')}</div><h2>학습 방법</h2><div class="flow"><span>핵심 개념</span><b>→</b><span>심화 설명</span><b>→</b><span>심사 적용</span><b>→</b><span>복습</span></div><p>완료 버튼으로 학습 진도를 기록하고, 북마크와 개인 메모를 이용하세요. 사례는 실제 원문을 확인하지 못한 경우 가상 연습으로 명시합니다.</p><h2>원천자료 및 검증 범위</h2><p>행안부와 교육부의 지침 게시 및 일부 법령 본문을 확인하여 구성한 1차 학습서입니다. 첨부자료 전문과 실제 질의회신·의회 검토보고서 전체는 분석하지 못했습니다. 출처별 상태를 확인하고 실제 업무 적용 시 해당 회계연도 기준을 검증하세요.</p><details><summary>공식 원천자료 ${Object.keys(sources).length}종 보기</summary>${refs(Object.keys(sources).join(''))}</details><h2>진도 백업 및 이동</h2><p>진도는 이 브라우저에 저장됩니다. 다른 휴대전화나 PC에서는 자동 동기화되지 않습니다. 백업 파일을 내보내고 다른 기기에서 가져오면 이어서 공부할 수 있습니다.</p><button onclick="backup()">진도 내보내기</button> <button onclick="document.getElementById('import').click()">진도 가져오기</button><input id="import" type="file" accept="application/json,.json" hidden onchange="restore(this)">`;}
function go(i,y=0){current=i;document.querySelector('aside').classList.remove('open');if(i<0){home()}else{mode=i<financeCount?0:1;let r=rows[i];state.last=i;state.y=y;save();$('main').innerHTML=`<div class="meta">${r[0]} · ${i+1} / ${rows.length}</div><h1>${esc(r[1])}</h1><button onclick="mark()" id="mark">${state.marks.includes(i)?'★ 북마크 해제':'☆ 북마크'}</button><h2>01 핵심 한 줄</h2><p class="lead">${esc(r[2])}</p><h2>02 전문가 개념과 원리</h2><p>${esc(r[3])}</p>${visual(i)}<h2>03 예결특위 심사 적용</h2><div class="panel"><b>분석·검증 포인트 (학습용 예시)</b><p>${esc(r[4])}</p></div><h2>04 복습 문답</h2><details><summary>${esc(r[5])}</summary><p><b>정답</b> ${esc(r[6])}</p></details><h2>05 근거 및 원문</h2>${refs(r[7])}<h2>06 개인 메모</h2><textarea id="note" placeholder="기억할 내용, 추가로 확인할 조문" oninput="state.notes[current]=this.value;save()">${esc(state.notes[i]||'')}</textarea><footer><button onclick="go(${i===financeCount?-1:i-1})">← 이전</button><button class="primary" onclick="complete()" id="complete">${state.done.includes(i)?'✓ 완료 (취소 가능)':'학습 완료'}</button><button onclick="go(${i+1<rows.length&&i+1!==financeCount?i+1:-1})">다음 →</button></footer>`}nav();requestAnimationFrame(()=>window.scrollTo(0,y))}
function visual(i){let t=rows[i][1];if(i>=financeCount){let diagrams={'서울시·교육청·시의회의 관계':['서울시의회 (의결)','시장 · 교육감 (집행)','서울시 재정 · 교육비특별회계'],'교육감과 본청 실·국':['교육감 · 부교육감','기획조정실 / 교육정책국','평생진로교육국 / 교육행정국'],'예산 심사의 단계와 조정':['교육감 제출','교육위원회 예비심사','예결특위 종합심사','본회의 의결'],'심사 지원 업무 흐름':['자료 확인','쟁점 분석','검토·질의 지원','의결 결과 정리']};if(diagrams[t])return '<div class="flow">'+diagrams[t].map(x=>'<span>'+esc(x)+'</span>').join('<b>→</b>')+'</div>';}if(t==='일반회계·특별회계·기금')return '<div class="flow"><span>지방재정</span><b>→</b><span>일반재정 / 교육재정</span><b>→</b><span>회계 및 기금</span></div>';if(t==='이용·전용·이체')return '<div class="table"><table><tr><th>이용</th><th>전용</th><th>이체</th></tr><tr><td>정책사업 간</td><td>정책사업 내</td><td>조직·권한 변경</td></tr><tr><td>사전 의결</td><td>법정 제한</td><td>조직 변경 근거</td></tr></table></div>';if(t==='명시·사고·계속비이월')return '<div class="table"><table><tr><th>명시</th><th>사고</th><th>계속비</th></tr><tr><td>사전 예상·의결</td><td>불가피한 사유 등</td><td>다년도 사업</td></tr></table></div>';if(t==='교육위원회와 예결특위')return '<div class="flow"><span>교육감 제출</span><b>→</b><span>교육위원회</span><b>→</b><span>예결특위</span><b>→</b><span>본회의</span></div>';if(t==='예산현액과 결산 수치')return '<div class="panel"><b>가상 예산현액 100억</b><div style="display:flex;height:22px;border-radius:5px;overflow:hidden;margin:12px 0"><div style="width:65%;background:#39749c"></div><div style="width:25%;background:#ba9562"></div><div style="width:10%;background:#8c9cab"></div></div><small>지출 65억 · 이월 25억 · 잔액 10억</small></div>';return ''}
function resume(){go(state.last,state.y)}function mark(){if(current<0)return;state.marks=state.marks.includes(current)?state.marks.filter(x=>x!==current):[...state.marks,current];save();$('mark').textContent=state.marks.includes(current)?'★ 북마크 해제':'☆ 북마크';nav()}function complete(){state.done=state.done.includes(current)?state.done.filter(x=>x!==current):[...state.done,current];save();$('complete').textContent=state.done.includes(current)?'✓ 완료 (취소 가능)':'학습 완료';nav()}function bookmarks(){current=-1;$('main').innerHTML='<h1>북마크</h1>'+ (state.marks.map(i=>`<p><button onclick="go(${i})">${esc(rows[i][1])} →</button></p>`).join('')||'<p>저장한 단원이 없습니다.</p>');nav();window.scrollTo(0,0)}function font(d){state.size=Math.max(14,Math.min(24,state.size+d));document.documentElement.style.setProperty('--size',state.size+'px');save()}function theme(){state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);save()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='education-finance-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(input){try{let v=JSON.parse(await input.files[0].text());if(!Array.isArray(v.done)||!Array.isArray(v.marks)||!Number.isInteger(v.last)||v.last<0||v.last>=rows.length)throw Error();state={...state,...v,done:[...new Set(v.done.filter(i=>Number.isInteger(i)&&i>=0&&i<rows.length))],marks:[...new Set(v.marks.filter(i=>Number.isInteger(i)&&i>=0&&i<rows.length))]};save();location.reload()}catch(e){alert('올바른 진도 백업 파일을 선택하세요.')}}$('search').oninput=nav;$('tocToggle').onclick=()=>$('side').classList.toggle('open');let timer;window.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(()=>{if(current>=0){state.y=window.scrollY;save()}},150)},{passive:true});window.addEventListener('pagehide',()=>{if(current>=0){state.y=window.scrollY;save()}});document.body.classList.toggle('dark',state.dark);document.documentElement.style.setProperty('--size',state.size+'px');go(-1);
</script></body></html>
